<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"><rect width="900" height="420" rx="22" fill="#0b1020"/><rect x="26" y="26" width="848" height="368" rx="16" fill="#111a2e" stroke="#263754"/><circle cx="54" cy="54" r="7" fill="#fb7185"/><circle cx="78" cy="54" r="7" fill="#fbbf24"/><circle cx="102" cy="54" r="7" fill="#34d399"/><text x="135" y="61" fill="#94a3b8" font-family="monospace" font-size="15">smart-downloads-tidy-up</text><text x="58" y="128" fill="#e2e8f0" font-family="monospace" font-size="19">$ python -m smart_downloads_tidy_up --downloads ~/Downloads</text><text x="58" y="180" fill="#86efac" font-family="monospace" font-size="18">Watching ~/Downloads. Press Ctrl+C to stop.</text><text x="58" y="232" fill="#cbd5e1" font-family="monospace" font-size="18">report.pdf   → Documents/report.pdf</text><text x="58" y="270" fill="#cbd5e1" font-family="monospace" font-size="18">photo.jpg    → Images/photo.jpg</text><text x="58" y="308" fill="#fcd34d" font-family="monospace" font-size="18">archive.zip  → Archives/archive.zip</text><text x="58" y="366" fill="#64748b" font-family="monospace" font-size="13">waits for completed writes · collision-safe names · non-recursive watch</text></svg>
